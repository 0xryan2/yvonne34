<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Anywhere With You Feels Right</title>
<meta name="description" content="A little something for your birthday." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* ----------  PALETTE (PRD §4.1)  ---------- */
  :root {
    --grad-top: #D9A1A0;   /* dusty rose */
    --grad-mid: #E8B89A;   /* peach */
    --grad-base:#F2D9C9;   /* cream blush */
    --white:    #FFFFFF;
    --dark:     #6E443F;   /* rose-brown */
    --muted:    #9B7E74;
    --accent:   #C9756B;   /* terracotta */
    --maxw: 430px;
    --pad: 24px;
    --gap: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--dark);
    /* gradient runs behind the ENTIRE page, fixed so all cards share one wash */
    background: linear-gradient(180deg,
        #C9807F 0%,
        var(--grad-top) 18%,
        var(--grad-mid) 45%,
        var(--grad-base) 72%,
        #F5E4DA 100%);
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
    position: relative;
    z-index: 1;            /* sit above the falling petals */
  }

  /* ----------  FALLING FLOWERS  ---------- */
  #petals {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;  /* never block taps */
    z-index: 0;
  }
  .petal {
    position: absolute;
    top: -8vh;
    will-change: transform;
    line-height: 1;
    user-select: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes fall {
    0%   { transform: translate3d(0, -8vh, 0) rotate(0deg); }
    50%  { transform: translate3d(18px, 55vh, 0) rotate(180deg); }
    100% { transform: translate3d(-12px, 112vh, 0) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .petal { display: none; }   /* respect motion preferences */
  }

  /* ----------  MUSIC PLAY BUTTON  ---------- */
  .play-btn {
    display: block;
    margin: 22px auto 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.45);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: var(--dark);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    position: relative;
    z-index: 2;
    transition: transform .15s ease, background .2s ease;
    box-shadow: 0 4px 14px rgba(110,68,63,0.12);
  }
  .play-btn:hover  { background: rgba(255,255,255,0.6); }
  .play-btn:active { transform: scale(0.93); }

  /* ----------  HERO (PRD §4.4)  ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    padding-top: 15svh;
    padding-bottom: 36px;
    overflow: hidden;
  }
  /* soft white radial sun glow, top-center */
  .hero::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 160vw;
    max-width: 800px;
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.35) 30%, rgba(255,255,255,0.12) 55%, rgba(255,255,255,0) 70%);
    pointer-events: none;
    z-index: 0;
  }
  .hero > * { position: relative; z-index: 1; }

  .eyebrow {
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 4px;
    margin: 0 0 18px;
  }

  .headline {
    font-family: 'Fraunces', 'Playfair Display', serif;
    font-weight: 700;
    color: var(--white);
    font-size: clamp(23px, 7.2vw, 28px);
    line-height: 1.16;
    margin: 0 auto 14px;
    max-width: 85%;
    padding: 0 6px;          /* never touches edges */
    text-shadow: 0 1px 14px rgba(110,68,63,0.16);
  }

  .subline {
    color: var(--white);
    font-style: italic;
    font-size: 15px;
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    opacity: 0.95;
  }
  /* frosted card lower in hero */
  .hero-card {
    margin-top: 38svh;
    margin-bottom: 0;
    width: 100%;
    background: rgba(242, 217, 201, 0.62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: 26px;
    padding: 24px 22px;
    box-shadow: 0 10px 30px rgba(110,68,63,0.10);
  }
  .hero-card .line1 {
    font-family: 'Fraunces', 'Playfair Display', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--dark);
    margin: 0 0 8px;
  }
  .hero-card .instruction {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }

  .day:focus-visible,
  .session:focus-visible {
    outline: 3px solid rgba(255,255,255,0.9);
    outline-offset: 3px;
  }

  /* ----------  DAY CARDS (PRD §4.5)  ---------- */
  .days { display: flex; flex-direction: column; gap: var(--gap); padding-top: 8px; }

  .day {
    border-radius: 24px;
    padding: 24px;
    transition: background .4s ease, opacity .4s ease;
  }
  .day.locked {
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(255,255,255,0.75);
  }
  .day.unlocked {
    background: rgba(255,255,255,0.78);
    border: 1.5px solid rgba(255,255,255,0.55);
    box-shadow: 0 8px 24px rgba(110,68,63,0.08);
  }

  .day-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .date-label {
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
  }
  .chip-countdown {
    background: rgba(217, 161, 160, 0.35);
    color: var(--dark);
  }
  .chapter-title {
    font-family: 'Fraunces', 'Playfair Display', serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--dark);
    margin: 8px 0 0;
    line-height: 1.2;
  }
  .day.locked .chapter-title { opacity: 0.5; }

  .sessions { margin-top: 18px; display: flex; flex-direction: column; gap: 16px; }

  .session {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 13px;
    align-items: start;
    min-height: 44px;
    cursor: pointer;
    background: none;
    border: none;
    text-align: left;
    padding: 4px 2px;
    border-radius: 12px;
    width: 100%;
    font: inherit;
    color: inherit;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    margin-top: 4px;
    flex: none;
    transition: background .4s ease, box-shadow .4s ease;
  }
  .session.waiting .dot {
    background: transparent;
    border: 2px solid var(--accent);
    box-sizing: border-box;
  }
  .session.revealed .dot {
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(201,117,107,0.16);
  }

  .riddle {
    font-style: italic;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.5;
    margin: 0 0 10px;
  }

  .answer-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(232, 184, 154, 0.45);
    border-radius: 999px;
    padding: 8px 15px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--dark);
    line-height: 1.25;
  }
  .tease-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(242, 217, 201, 0.85);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 999px;
    padding: 8px 15px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    font-style: italic;
    line-height: 1.25;
  }
  /* the playful "not yet" line shown on tap of a waiting session */
  .notyet {
    margin: 9px 0 0;
    font-size: 12.5px;
    font-style: italic;
    color: var(--accent);
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height .35s ease, opacity .35s ease, margin .35s ease;
  }
  .session.show-notyet .notyet { max-height: 60px; opacity: 1; margin-top: 9px; }

  /* ----------  FINAL CARD (PRD §4.7)  ---------- */
  .final {
    margin-top: var(--gap);
    border-radius: 24px;
    padding: 26px 24px;
    text-align: center;
    background: rgba(255,255,255,0.62);
    border: 1.5px solid rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .final .eyebrow-final {
    font-family: 'Fraunces', 'Playfair Display', serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--dark);
    margin: 0 0 12px;
  }
  .final.locked .final-body { color: var(--muted); font-size: 13.5px; font-style: italic; }
  .final.unlocked {
    background: rgba(242, 217, 201, 0.7);
  }
  .final .final-body {
    font-size: 14.5px;
    color: var(--dark);
    line-height: 1.6;
    margin: 0;
    white-space: pre-line;
  }

  .footer {
    text-align: center;
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    padding: 30px 0 26px;
    letter-spacing: 0.3px;
    opacity: 0.85;
  }

  /* ----------  MOTION (PRD §4.6)  ---------- */
  .reveal-on-scroll {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .reveal-on-scroll.in { opacity: 1; transform: none; }

  .fade-in { animation: softfade .7s ease both; }
  @keyframes softfade { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .reveal-on-scroll { opacity: 1; transform: none; }
  }

  @media (min-width: 460px) {
    .headline { font-size: 30px; }
  }
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>

<main class="wrap">
  <!-- ========== HERO ========== -->
  <header class="hero">
    <p class="eyebrow" id="hero-eyebrow"></p>
    <h1 class="headline" id="hero-headline"></h1>
    <p class="subline" id="hero-subline"></p>

    <button id="play-btn" class="play-btn" aria-label="Play music">▶</button>

    <div class="hero-card">
      <p class="line1" id="hero-line1"></p>
      <p class="instruction" id="hero-instruction"></p>
    </div>
  </header>

  <!-- ========== DAY CARDS ========== -->
  <section class="days" id="days" aria-label="The plan"></section>

  <!-- ========== FINAL CARD ========== -->
  <section id="final-mount"></section>

  <footer class="footer" id="footer"></footer>
</main>

<script>
/* ============================================================
   CONFIG — all editable copy + all unlock ISO strings (PRD §8)
   unlockISO times drive reveal logic and must NEVER be rendered.
   ============================================================ */
const CONFIG = {
  recipientName: "Yvonne",

  hero: {
    eyebrow: "27 JUNE 2026",
    headline: "Anywhere With You Feels Right",
    subline: "happy birthday, fiancée",
    line1: "Your first birthday as an us.",
    instruction: "Each one shows itself right when it begins.",
  },

  footer: "Ryan ♡ Yvonne",

  // time-free teases for pending sessions (one is picked per session)
  teases: ["soon, my love", "later today", "not long now"],

  // playful, never-spoiling, time-free line shown on tapping a waiting session
  notYetLine: "not yet, my love — this one shows itself soon.",

  // ----- day cards, in date order -----
  days: [
    {
      dateISO: "2026-06-24",
      dateLabel: "24 June",
      title: "Platter and Spatter",
      sessions: [
        {
          unlockISO: "2026-06-24T14:00:00+08:00",
          riddle: "The taste that means home to you, the one you'd choose over anything fancier.",
          answer: "Your favourite ba zhang",
        },
        {
          unlockISO: "2026-06-24T20:00:00+08:00",
          riddle: "We've laughed about trying this for years. Tonight there's no script and nowhere to hide.",
          answer: "Improv workshop",
        },
      ],
    },
    {
      dateISO: "2026-06-25",
      dateLabel: "25 June",
      title: "A Dark Little Detour",
      sessions: [
        {
          unlockISO: "2026-06-25T21:00:00+08:00",
          riddle: "The kind of fear you only enjoy when you're not facing it alone.",
          answer: "Thriller theatre night",
        },
      ],
    },
    {
      dateISO: "2026-06-26",
      dateLabel: "26 June",
      title: "Make & Char",
      sessions: [
        {
          unlockISO: "2026-06-26T14:00:00+08:00",
          riddle: "Messy, slow, and a little frustrating — right up until it isn't. You'll surprise yourself.",
          answer: "Pottery workshop",
        },
        {
          unlockISO: "2026-06-26T18:00:00+08:00",
          riddle: "Smoky, charred, faintly of the sea — and the last bite always somehow ends up mine.",
          answer: "Your favourite sambal BBQ",
        },
      ],
    },
    {
      dateISO: "2026-06-27",
      dateLabel: "27 June",
      title: "The Main Event",
      sessions: [
        {
          unlockISO: "2026-06-27T13:00:00+08:00",
          riddle: "Somewhere quiet and refined, where the familiar gets reimagined into something you won't quite expect.",
          answer: "Lunch at Belimbing",
        },
        {
          unlockISO: "2026-06-27T16:00:00+08:00",
          riddle: "Old streets, real secrets, told by the very people who lived them.",
          answer: "Triad Trails walking tour",
        },
        {
          // NOTE: confirm comedy/stand-up start time before launch — currently 20:00.
          unlockISO: "2026-06-27T20:00:00+08:00",
          riddle: "A room full of strangers, and you laughing harder than you expected to.",
          answer: "Our first stand-up",
        },
      ],
    },
  ],

  // ----- final "One more thing" card -----
  final: {
    unlockISO: "2026-06-27T00:00:00+08:00",
    heading: "One more thing",
    unlockedHeading: "Happy birthday!",
    lockedLabel: "Opens on your birthday.",
    note: "If it’s you, anywhere just feels right.\n\nYou’ve been my sunshine. I want to spend the rest of my life being yours.\n\nI love doing all the small things with you, and looking for new adventures with you just the same. This is the only birthday we’ll ever spend engaged. Next year I get to call you my wife.\n\nAnd we’ll celebrate every single birthday feeling grateful for the fact that we have each other.\n\nYou’re the greatest gift to me. I love you.",
  },
};

/* ============================================================
   TIME GATING (PRD §5) — the critical part.
   ============================================================ */

// Single source of "now". Hidden ?now=<ISO8601> override for QA (PRD §5.4).
function getNow() {
  const p = new URLSearchParams(window.location.search).get("now");
  if (p) {
    const t = new Date(p).getTime();
    if (!Number.isNaN(t)) return t;
  }
  return Date.now();
}

// A day soft-unlocks at 00:00 +08:00 of its date (PRD §5.1).
function dayUnlockMs(dateISO) {
  return new Date(dateISO + "T00:00:00+08:00").getTime();
}

// Epoch-ms comparison only — never local-date strings, never setHours (PRD §5.2).
function isUnlocked(unlockISO) {
  return getNow() >= new Date(unlockISO).getTime();
}

// whole days between now and a future midnight, for "in X days"
function daysUntil(targetMs) {
  const DAY = 24 * 60 * 60 * 1000;
  return Math.max(1, Math.ceil((targetMs - getNow()) / DAY));
}

// stable tease pick per session (no rendered time)
function teaseFor(unlockISO) {
  let h = 0;
  for (let i = 0; i < unlockISO.length; i++) h = (h * 31 + unlockISO.charCodeAt(i)) >>> 0;
  return CONFIG.teases[h % CONFIG.teases.length];
}

/* ============================================================
   RENDER (PRD §4.5, §6, §7)
   ============================================================ */
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function renderStatic() {
  const h = CONFIG.hero;
  document.getElementById("hero-eyebrow").textContent = h.eyebrow;
  document.getElementById("hero-headline").textContent = h.headline;
  document.getElementById("hero-subline").textContent = h.subline;
  document.getElementById("hero-line1").textContent = h.line1;
  document.getElementById("hero-instruction").textContent = h.instruction;
  document.getElementById("footer").textContent = CONFIG.footer;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function buildSession(sess) {
  const revealed = isUnlocked(sess.unlockISO);
  const btn = el("button", "session " + (revealed ? "revealed" : "waiting"));
  btn.type = "button";
  btn.setAttribute("aria-expanded", revealed ? "true" : "false");

  btn.appendChild(el("span", "dot"));

  const body = el("div");
  body.appendChild(el("p", "riddle", escapeHtml(sess.riddle)));

  if (revealed) {
    body.appendChild(el("span", "answer-chip", escapeHtml(sess.answer)));
  } else {
    body.appendChild(el("span", "tease-chip", escapeHtml(teaseFor(sess.unlockISO))));
    body.appendChild(el("p", "notyet", escapeHtml(CONFIG.notYetLine)));
  }

  btn.appendChild(body);

  // Interaction (PRD §7): waiting → toggle playful "not yet"; revealed → already shows chip.
  btn.addEventListener("click", () => {
    if (btn.classList.contains("waiting")) {
      btn.classList.toggle("show-notyet");
    }
  });

  return btn;
}

function buildDay(day) {
  const unlocked = getNow() >= dayUnlockMs(day.dateISO);
  const card = el("article", "day reveal-on-scroll " + (unlocked ? "unlocked" : "locked"));

  const head = el("div", "day-head");
  head.appendChild(el("span", "date-label", escapeHtml(day.dateLabel)));
  if (!unlocked) {
    const n = daysUntil(dayUnlockMs(day.dateISO));
    head.appendChild(el("span", "chip chip-countdown", `in ${n} day${n === 1 ? "" : "s"}`));
  }
  card.appendChild(head);

  card.appendChild(el("h2", "chapter-title", escapeHtml(day.title)));

  // Locked day shows NO riddles (PRD §4.5 / §7)
  if (unlocked) {
    const list = el("div", "sessions");
    day.sessions.forEach(s => list.appendChild(buildSession(s)));
    card.appendChild(list);
  } else {
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", `${day.dateLabel}, locked. ${day.title}.`);
  }

  return card;
}

function buildFinal() {
  const f = CONFIG.final;
  const unlocked = isUnlocked(f.unlockISO);
  const card = el("article", "final reveal-on-scroll " + (unlocked ? "unlocked" : "locked"));
  card.appendChild(el("p", "eyebrow-final", escapeHtml(unlocked ? f.unlockedHeading : f.heading)));
  card.appendChild(el("p", "final-body", escapeHtml(unlocked ? f.note : f.lockedLabel)));
  return card;
}

function render() {
  renderStatic();

  const daysMount = document.getElementById("days");
  daysMount.innerHTML = "";
  CONFIG.days.forEach(d => daysMount.appendChild(buildDay(d)));

  const finalMount = document.getElementById("final-mount");
  finalMount.innerHTML = "";
  finalMount.appendChild(buildFinal());

  observeReveals();
}

/* scroll-in motion (PRD §4.6) */
let io;
function observeReveals() {
  if (io) io.disconnect();
  io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal-on-scroll").forEach(n => io.observe(n));
}

/* ============================================================
   STATE RECOMPUTE (PRD §5.3)
   ============================================================ */
render();

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) render();
});

// optional low-frequency refresh while left open
setInterval(() => { if (!document.hidden) render(); }, 5 * 60 * 1000);

/* ============================================================
   FALLING FLOWERS — subtle, varied, behind the content
   ============================================================ */
(function petals() {
  const layer = document.getElementById("petals");
  if (!layer) return;
  const GLYPHS = ["\u{1F338}", "\u{1F33C}", "❀"]; // cherry blossom, blossom, floral heart
  const COUNT = 14;
  const rand = (min, max) => min + Math.random() * (max - min);

  for (let i = 0; i < COUNT; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    p.style.left = rand(0, 100) + "vw";
    p.style.fontSize = rand(10, 20).toFixed(1) + "px";          // small, varied
    p.style.opacity = rand(0.22, 0.6).toFixed(2);               // see-through
    p.style.filter = "sepia(0.5) saturate(0.7) brightness(1.25)"; // warm cream tint
    p.style.animationDuration = rand(7, 15).toFixed(1) + "s";   // varied speed
    p.style.animationDelay = (-rand(0, 12)).toFixed(1) + "s";   // stagger, pre-roll
    layer.appendChild(p);
  }
})();

/* ============================================================
   BACKGROUND MUSIC — chorus loop, toggled by the play button
   ============================================================ */
(function music() {
  const btn = document.getElementById("play-btn");
  if (!btn) return;
  const audio = new Audio("audio/chorus.mp3");
  audio.loop = true;
  audio.preload = "auto";

  btn.addEventListener("click", () => {
    if (audio.paused) {
      audio.play().then(() => {
        btn.classList.add("playing");
        btn.textContent = "⏸"; // pause glyph
        btn.setAttribute("aria-label", "Pause music");
      }).catch(() => { /* missing file / blocked — fail silently */ });
    } else {
      audio.pause();
      btn.classList.remove("playing");
      btn.textContent = "▶"; // play glyph
      btn.setAttribute("aria-label", "Play music");
    }
  });
})();
</script>
</body>
</html>
